name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # BACKEND CI JOBS (Execução Paralela)
  # ============================================================================
  backend-lint:
    name: "Backend: Linter & Formatter (Ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  backend-typecheck:
    name: "Backend: Type Check (Mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Mypy Static Type Checking
        run: uv run mypy app

  backend-unit-tests:
    name: "Backend: Unit Tests (Pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Unit Tests
        run: uv run pytest tests/unit/ --cov=app --cov-report=term-missing

  backend-integration-tests:
    name: "Backend: Integration Tests (Pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Integration Tests
        run: uv run pytest tests/integration/ --cov=app/api --cov=app/services --cov-report=term-missing

  # ============================================================================
  # QUALITY & COVERAGE GATE (Enforcement 100% de Cobertura)
  # ============================================================================
  coverage-gate:
    name: "Quality Gate: 100% Code Coverage Enforcement"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Enforce Backend 100% Coverage Gate
        working-directory: backend
        run: uv run pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=100

  # ============================================================================
  # SECURITY GUARDRAILS GATE (Proteção Anti-Regressão de Testes de Segurança)
  # ============================================================================
  security-guardrails-gate:
    name: "Security Gate: Anti-Regression Guardrail Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Security Guardrails Integrity
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_security_guardrails.py

  # ============================================================================
  # ARCHITECTURE GATE (Guardião da Arquitetura Hexagonal & AST Import Checker)
  # ============================================================================
  architecture-gate:
    name: "Architecture Gate: Hexagonal Boundaries & Import Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Hexagonal Architecture Boundaries
        run: python scripts/check_hexagonal_architecture.py

  # ============================================================================
  # OBSERVABILITY GATE (Guardião da Telemetria & Zero Pontos Cegos)
  # ============================================================================
  telemetry-gate:
    name: "Observability Gate: Zero Blind Spots & Telemetry Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Observability & Structured Logging Compliance
        run: python scripts/check_telemetry_compliance.py


